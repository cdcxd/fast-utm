name: Release

# Push a tag like `v0.1.0` to stage packages/fast-proj via npm trusted publishing (OIDC; no token),
# then approve it on npmjs.com or with `npm stage approve`. Also creates the GitHub release from CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check tag matches package version
        run: test "v$(node -p "require('./packages/fast-proj/package.json').version")" = "$GITHUB_REF_NAME"
      # Development tools require a newer Node; exercise the built package
      # on its advertised minimum before publishing, then restore the toolchain.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check Node 20 package compatibility
        run: node packages/fast-proj/test/smoke.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - run: npm stage publish --provenance --access public
        working-directory: packages/fast-proj

  # Separate job: the publish job runs the dev dependencies and shouldn't hold a write token.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v || index($0, v " ") == 1 {f = 1; next} /^## / {f = 0} f' \
            packages/fast-proj/CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
