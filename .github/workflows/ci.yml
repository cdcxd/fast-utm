name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # One pinned runtime for package checks and the Wasm numerical contract.
    # Benchmarks remain local; oldest-runtime compatibility gates releases.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/fast-proj/wasm -> target
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: cargo test --release --locked --manifest-path packages/fast-proj/wasm/Cargo.toml
      - run: bash packages/fast-proj/wasm/build.sh --bench
      - run: node packages/fast-proj/wasm/bench/checks.mts
      - run: node packages/fast-proj/wasm/bench/accuracy.mts
